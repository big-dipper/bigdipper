# Render Blueprint: the static site, and the service Little Dippers connect to.
# Render → New → Blueprint → this repo. Every push to main redeploys.
services:
  - type: web
    name: bigdipper
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # Big Dipper's service: what Little Dippers connect to (service/). Separate from the site, so the site stays static.
  - type: web
    name: big-dipper-service
    runtime: node
    plan: starter
    rootDir: service
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Big Dipper's identity comes from this. Render makes it; never change it (Little Dippers remember the identity).
      - key: BD_IDENTITY_SECRET
        generateValue: true
      # Where feedback goes. Set in the dashboard: the API key is a secret, the rest are workspace details.
      - key: LINEAR_API_KEY
        sync: false
      - key: LINEAR_TEAM_ID
        sync: false
      - key: LINEAR_LABELS
        sync: false
      - key: LINEAR_LABEL_BUG
        sync: false
      - key: LINEAR_LABEL_IDEA
        sync: false
      - key: LINEAR_LABEL_QUESTION
        sync: false
      - key: LINEAR_LABEL_OTHER
        sync: false
      # Big Dipper Hosting (POST /hosting/start). The Fly token is a secret: set it in the dashboard.
      - key: FLY_API_TOKEN
        sync: false
      - key: FLY_ORG
        sync: false
      # Invite codes, comma-separated, while we open up slowly. Set in the dashboard; share links as /start?invite=CODE.
      - key: BD_HOSTING_INVITES
        sync: false
      - key: BD_SITE_ORIGINS
        value: https://bigdipper.onrender.com
      - key: BD_HOSTING_IMAGE
        value: ghcr.io/big-dipper/littledipper:0.4.8
